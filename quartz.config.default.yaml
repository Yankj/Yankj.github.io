# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: "Yankj's Knowledge"
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics:
    # 统计接入位：拿到分析服务的站点 ID 后再启用，避免把无效脚本发布到生产环境。
    # 推荐 GoatCounter（轻量、隐私友好）：provider: goatcounter + websiteId: <site-code>
    provider: null
  locale: zh-CN
  baseUrl: Yankj.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Inter
      body: Noto Sans SC
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#f4f1ea"
        lightgray: "#dedad0"
        gray: "#99978f"
        darkgray: "#44464f"
        dark: "#17181e"
        secondary: "#5b57d9"
        tertiary: "#bd6546"
        highlight: "rgba(91, 87, 217, 0.11)"
        textHighlight: "rgba(224, 150, 93, 0.34)"
      darkMode:
        light: "#111217"
        lightgray: "#2c2e36"
        gray: "#747780"
        darkgray: "#c8c7c2"
        dark: "#f1eee7"
        secondary: "#9a97ff"
        tertiary: "#ef9874"
        highlight: "rgba(154, 151, 255, 0.14)"
        textHighlight: "rgba(224, 136, 91, 0.28)"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
    order: 30
  - source: "./custom-plugins/mermaid-selfhost"
    enabled: true
    order: 35
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      useThemeFonts: false
      fontOrigin: googleFonts
      title:
        name: Inter
        weights: [400, 600, 700]
      header:
        name: Inter
        weights: [400, 600, 700]
      body:
        name: Noto Sans SC
        weights: [400, 500, 600]
      code:
        name: IBM Plex Mono
        weights: [400, 500, 600]
      h1: Inter
      h2: Inter
      h3: Inter
      h4: Inter
      h5: Inter
      h6: Inter
  - source: "@quartz-themes/core"
    # Yankj Fieldnote Dusk is implemented with project-owned design tokens in
    # quartz/styles/custom.scss; keep the package available, but do not layer a
    # third-party theme over it.
    enabled: false
    options:
      theme: macos
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: true
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    # Giscus 需要先在 GitHub Discussions 与 giscus.app 完成初始化，再填 options。
    enabled: false
    options:
      provider: giscus
      options:
        # repo: Yankj/Yankj.github.io
        # repoId: ""
        # category: Announcements
        # categoryId: ""
        # mapping: pathname
        # strict: 0
        # reactionsEnabled: 1
        # emitMetadata: 0
        # inputPosition: bottom
        # lang: zh-CN
    layout:
      position: afterBody
      priority: 10
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/Yankj
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
        - section
        - knowledgeType
        - category
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
    order: 900
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
